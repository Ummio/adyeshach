name: Build Jar with Gradle

on:
  push:
    branches:
      - 2.0  # 指定触发工作流的分支，可根据需要修改
  pull_request:
    branches:
      - 2.0

jobs:
  build:
    runs-on: ubuntu-latest  # 使用最新的Ubuntu环境

    steps:
    - name: Checkout code  # 检出代码
      uses: actions/checkout@v3

    - name: Set up JDK 8  # 设置JDK版本为8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'adopt'

    - name: Grant execute permission for gradlew  # 赋予gradlew执行权限
      run: chmod +x gradlew

    - name: Build with Gradle  # 使用Gradle Wrapper构建项目
      run: ./gradlew build

    - name: Archive Jar files  # 将构建好的jar文件存档
      uses: actions/upload-artifact@v3
      with:
        name: adyeshach-jar  # 存档名称，可根据需要修改
        path: '**/build/libs/*.jar'  # jar文件路径，根据项目结构调整
